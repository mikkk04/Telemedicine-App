<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teleconsultation</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/desktop.css" media="(min-width: 769px)">
    <style>
        /* --- GLOBAL STYLES (Applies to both Mobile and Desktop) --- */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scroll bounce */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000; /* Dark background default */
        }

        /* Modal Styles (Global) */
        .notification-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .notification-modal-content {
            background-color: #fff;
            padding: 24px 32px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 90%;
            width: 350px;
        }
        .notification-modal-content h2 {
            margin-top: 0;
            color: #333;
            font-size: 20px;
        }
        .notification-modal-content button {
            background-color: #5C6BC0;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
            transition: background-color 0.2s;
        }
        .notification-modal-content button:hover {
            background-color: #3F51B5;
        }

        /* --- MOBILE ONLY STYLES (Max-width 768px) --- */
        /* These styles will NOT affect your desktop view */
        @media (max-width: 768px) {
            
            /* Base Call Interface Layout for Mobile */
            #call-interface {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                background-color: #000;
            }

            /* Header: Transparent overlay on mobile */
            #call-header {
                flex: 0 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background: rgba(0, 0, 0, 0.5);
                color: #fff;
                z-index: 50;
                font-size: 0.9rem;
            }

            /* Main Body: Flex container */
            #call-body-layout {
                flex: 1;
                display: flex;
                position: relative;
                overflow: hidden;
                width: 100%;
            }

            /* Main Content (Video Area) */
            #main-content {
                flex: 1;
                position: relative;
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;
            }

            #mainVideoContainer {
                flex: 1;
                width: 100%;
                height: 100%;
                position: relative;
                background: #000;
            }

            #mainVideo {
                width: 100%;
                height: 100%;
                object-fit: cover; /* Fills mobile screen */
                display: block;
            }

            /* Mini Video Mobile Positioning */
            #miniVideoContainer {
                position: absolute;
                top: 60px; /* Below header */
                right: 15px;
                width: 90px;
                height: 120px;
                border-radius: 8px;
                overflow: hidden;
                border: 2px solid rgba(255,255,255,0.3);
                z-index: 60;
                background: #000;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }
            #miniVideo {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Controls: Floating Overlay at Bottom Center */
            #control-tab {
                position: absolute;
                bottom: 25px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 12px;
                padding: 10px 20px;
                background: rgba(255, 255, 255, 0.25);
                backdrop-filter: blur(8px);
                border-radius: 30px;
                z-index: 100;
                width: auto;
                max-width: 90%;
                justify-content: center;
            }

            #control-tab button {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                border: none;
                color: white;
                background: rgba(0,0,0,0.6);
                font-size: 18px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #control-tab button:hover {
                transform: scale(1.1);
            }
            #control-tab button.end-call-button {
                background: #ff4444;
            }

            /* Chat Mobile: Full Screen Overlay */
            #chat-container {
                display: none; /* Controlled by JS */
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #f5f5f5;
                flex-direction: column;
                z-index: 200;
            }

            /* Force display flex when active on mobile */
            #chat-container[style*="display: block"], 
            #chat-container[style*="display: flex"] {
                display: flex !important;
            }

            #chat-header {
                padding: 15px;
                background: #fff;
                border-bottom: 1px solid #ddd;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            #chat-box {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
            }

            #chat-controls {
                padding: 10px;
                background: #fff;
                border-top: 1px solid #ddd;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            
            .chat-input {
                flex: 1;
                padding: 10px;
                border-radius: 20px;
                border: 1px solid #ccc;
            }

            /* Camera POV Interface Mobile Fix */
            #camera-pov-interface {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000;
                z-index: 300;
                display: flex;
                flex-direction: column;
            }
            .camera-pov-video-wrapper {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            #cameraPovVideo {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .camera-pov-controls {
                position: absolute;
                bottom: 30px;
                width: 100%;
                display: flex;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="background-sticker sticker-stethoscope"></div>
    <div class="background-sticker sticker-heartbeat"></div>
    <div class="background-sticker sticker-dna"></div>
    <div class="background-sticker sticker-pill"></div>
    <div class="background-sticker sticker-microscope"></div>
    <div class="background-sticker sticker-mmh"></div>

    <h1 class="teleconsultation-title" style="display:none;">Teleconsultation</h1>

    <div id="loading-screen" class="loading-screen" style="display: none;">
        <p>Loading...</p>
    </div>

    <div id="call-interface" class="call-interface" style="display: none;">
        <div id="call-header" class="call-header">
            <div class="header-left-group"> <span>Room ID: <strong id="activeRoomCode">--</strong></span>
            </div>
            <span><strong id="callTimer">00:00:00</strong></span>
        </div>

        <div id="call-body-layout">
            <div id="main-content" class="main-content">
                <div id="mainVideoContainer" class="video-wrapper">
                    <video id="mainVideo" autoplay playsinline></video>
                    <div id="mainVideoNameLabel" class="name-label"></div>

                    <div id="miniVideoContainer" class="video-wrapper mini-preview-hidden">
                        <video id="miniVideo" autoplay muted playsinline></video>
                        <div id="miniVideoNameLabel" class="name-label"></div>
                    </div>
                </div>

                <div id="control-tab" class="control-tab">
                    <button id="toggleMicBtn" title="Toggle Microphone"><i class="fas fa-microphone"></i></button>
                    <button id="toggleCamBtn" title="Toggle Camera"><i class="fas fa-video"></i></button>
                    <button id="toggleChatBtn" title="Toggle Chat"><i class="fa fa-comment"></i></button>
                    <button id="endCallBtn" title="End Call" class="end-call-button"><i class="fas fa-phone-slash"></i></button>
                </div>
            </div>

            <div id="chat-container" class="chat-container">
                <div id="chat-header" class="chat-header">
                    <span>
                        <span id="chatPeerNameDisplay">Waiting for user</span>
                        <span id="peerStatusDot" class="peer-status-dot status-offline"></span>
                        <span id="typingIndicator" class="typing-indicator" style="display: none;"></span>
                    </span>
                    <div style="display:flex; gap: 5px;">
                        <button id="saveChatHistoryBtn" class="icon-button" title="Save Chat History" style="border:none; background:none; cursor:pointer;">
                            <i class="fas fa-save"></i>
                        </button>
                        <button id="exitChatBtn" class="exit-btn" title="Close Chat" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">&#x2716;</button>
                    </div>
                </div>

                <div id="chat-box" class="chat-box">
                </div>

                <div id="chat-controls" class="chat-controls">
                    <label id="fileIcon" class="file-icon" title="Attach File">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" id="fileInput" class="file-input" style="display: none;" />
                    </label>
                    <button id="takePictureBtn" title="Take a Picture"><i class="fas fa-camera"></i></button>
                    <input id="chatInput" type="text" class="chat-input" placeholder="Type a message..." disabled>
                    <button id="sendChatBtn" title="Send Message" disabled><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="camera-pov-interface" class="camera-pov-interface" style="display: none;">
        <div class="camera-pov-header" style="position: absolute; top: 10px; left: 10px; z-index: 10; width: 100%; display:flex; justify-content: space-between; padding-right: 20px; box-sizing: border-box;">
            <button id="backToCallBtn" class="control-btn" title="Back to Call" style="background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 10px; border-radius: 50%;">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <span id="recordingIndicator" class="recording-indicator" style="color: red; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 15px;">
                <i class="fas fa-circle recording-dot"></i> REC
            </span>
            <button id="switchCamPovBtn" class="control-btn camera-switch-btn" title="Switch Camera" style="background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 10px; border-radius: 50%;">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        <div class="camera-pov-video-wrapper">
            <video id="cameraPovVideo" autoplay playsinline muted></video>
        </div>
        <div class="camera-pov-controls">
            <button id="captureShotBtn" class="capture-btn" title="Capture Photo or Record Video" style="width: 70px; height: 70px; border-radius: 50%; background: white; border: 4px solid #ccc;"></button>
        </div>
    </div>

    <div id="shot-preview-interface" class="shot-preview-interface" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 350;">
        <div class="shot-preview-image-wrapper" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
            <img id="capturedShotImage" src="" alt="Captured Photo" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain;">
            <video id="capturedVideoPreview" src="" controls playsinline style="display: none; max-width: 100%; max-height: 100%;"></video>
        </div>
        <div class="preview-controls" style="position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around;">
            <button id="retakeShotBtn" class="action-btn retake-btn" title="Retake" style="background: #ff4444; color: white; padding: 10px 20px; border: none; border-radius: 20px;">
                <i class="fas fa-camera-rotate"></i> Retake
            </button>
            <button id="sendShotBtn" class="action-btn send-btn" title="Upload & Send" style="background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 20px;">
                <i class="fas fa-arrow-up-from-bracket"></i> Send
            </button>
        </div>
    </div>

    <canvas id="hiddenPhotoCanvas" style="display:none;"></canvas>

    <div id="call-ended-modal" class="notification-modal-overlay" style="display: none;">
        <div class="notification-modal-content">
            <h2 id="call-ended-message">The call has ended.</h2>
            <button id="call-ended-ok-btn">OK</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/script-base.js"></script>
    <script src="/script-logic.js"></script>

</body>
</html>
