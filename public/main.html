<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teleconsultation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/desktop.css" media="(min-width: 769px)">

    <style>
        /* --- GLOBAL & VIDEO CSS (Keeping these to ensure Video/Camera features stay intact) --- */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* --- CAMERA POV STYLES (Unchanged) --- */
        .camera-pov-interface {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 300; display: flex; flex-direction: column;
        }
        .camera-pov-header {
            position: absolute; top: 20px; left: 0; width: 100%; padding: 0 20px;
            box-sizing: border-box; z-index: 10; display: flex; justify-content: space-between; align-items: center;
        }
        .camera-pov-video-wrapper {
            flex: 1; width: 100%; height: 100%; display: flex; align-items: center;
            justify-content: center; overflow: hidden; background: #000;
        }
        #cameraPovVideo { width: 100%; height: 100%; object-fit: cover; display: block; }
        .camera-pov-controls {
            position: absolute; bottom: 40px; left: 0; width: 100%; display: flex;
            justify-content: center; align-items: center; z-index: 10; pointer-events: none;
        }
        .cam-overlay-btn {
            width: 45px; height: 45px; border-radius: 50%; background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; pointer-events: auto;
        }
        .cam-shutter-btn {
            width: 72px; height: 72px; border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            border: 4px solid white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto;
        }
        .cam-shutter-inner {
            width: 54px; height: 54px; border-radius: 50%; background: white; transition: all 0.2s;
        }
        .cam-shutter-btn.recording .cam-shutter-inner { background: #ff4444; border-radius: 8px; width: 30px; height: 30px; }
        
        /* --- VIDEO CALL INTERFACE SPECIFIC STYLES --- */
        #call-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; background-color: #000;
        }
        #call-header {
            flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: rgba(0, 0, 0, 0.5); color: #fff; z-index: 50; font-size: 0.9rem;
            padding-top: max(10px, env(safe-area-inset-top));
        }
        #call-body-layout { flex: 1; display: flex; position: relative; overflow: hidden; width: 100%; height: 100%; }
        #main-content { flex: 1; position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; }
        #mainVideoContainer { flex: 1; width: 100%; height: 100%; position: relative; background: #000; }
        #mainVideo { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        #miniVideoContainer {
            position: absolute; top: calc(60px + env(safe-area-inset-top)); right: 15px;
            width: 90px; height: 120px; border-radius: 8px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3); z-index: 60; background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #miniVideo { width: 100%; height: 100%; object-fit: cover; }

        /* Control Tab (Video) */
        #control-tab {
            position: absolute; bottom: max(25px, env(safe-area-inset-bottom)); left: 50%;
            transform: translateX(-50%); display: flex; gap: 12px; padding: 10px 20px;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px);
            border-radius: 30px; z-index: 100; width: auto; max-width: 90%; justify-content: center;
        }
        #control-tab button {
            width: 42px; height: 42px; border-radius: 50%; border: none; color: white;
            background: rgba(0,0,0,0.6); font-size: 18px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        #control-tab button.end-call-button { background: #ff4444; }

        /* Mobile specific adjustments */
        @media (min-width: 769px) {
            #miniVideoContainer { top: 20px; right: 20px; width: 240px; height: 180px; }
            #control-tab { bottom: 30px; }
        }
    </style>
</head>
<body>

    <div class="background-sticker sticker-stethoscope"></div>
    <div class="background-sticker sticker-heartbeat"></div>
    <div class="background-sticker sticker-dna"></div>
    <div class="background-sticker sticker-pill"></div>
    <div class="background-sticker sticker-microscope"></div>
    <div class="background-sticker sticker-mmh"></div>

    <h1 class="teleconsultation-title" style="display:none;">Teleconsultation</h1>

    <div id="loading-screen" class="loading-screen" style="display: none;">
        <p>Loading...</p>
    </div>

    <div id="call-interface" class="call-interface" style="display: none;">
        <div id="call-header">
            <div class="header-left-group"> <span>Room ID: <strong id="activeRoomCode">--</strong></span>
            </div>
            <span><strong id="callTimer">00:00:00</strong></span>
        </div>

        <div id="call-body-layout">
            <div id="main-content">
                <div id="mainVideoContainer">
                    <video id="mainVideo" autoplay playsinline></video>
                    <div id="mainVideoNameLabel" class="name-label"></div>

                    <div id="miniVideoContainer" class="video-wrapper mini-preview-hidden">
                        <video id="miniVideo" autoplay muted playsinline></video>
                        <div id="miniVideoNameLabel" class="name-label"></div>
                    </div>
                </div>

                <div id="control-tab">
                    <button id="toggleMicBtn" title="Toggle Microphone"><i class="fas fa-microphone"></i></button>
                    <button id="toggleCamBtn" title="Toggle Camera"><i class="fas fa-video"></i></button>
                    <button id="toggleChatBtn" title="Toggle Chat"><i class="fa fa-comment"></i></button>
                    <button id="endCallBtn" title="End Call" class="end-call-button"><i class="fas fa-phone-slash"></i></button>
                </div>
            </div>
        </div>

        <div id="chat-container" style="display: none;" 
             class="fixed inset-0 z-[9999] flex flex-col bg-slate-50 w-full h-[100dvh]">
            
            <div id="chat-header" 
                 class="flex-none flex justify-between items-center bg-white border-b border-gray-200 px-4 py-3 pt-[max(1rem,env(safe-area-inset-top))] shadow-sm">
                
                <div class="flex items-center gap-2">
                    <span id="peerStatusDot" class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="chatPeerNameDisplay" class="font-semibold text-gray-800 text-sm">Waiting for user</span>
                    <span id="typingIndicator" class="text-xs text-gray-500 italic hidden">typing...</span>
                </div>

                <div class="flex gap-3">
                    <button id="saveChatHistoryBtn" class="text-gray-500 hover:text-blue-600 transition">
                        <i class="fas fa-save text-lg"></i>
                    </button>
                    <button id="exitChatBtn" class="text-gray-500 hover:text-red-500 transition">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
            </div>

            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                </div>

            <div id="chat-controls" 
                 class="flex-none flex items-center gap-2 bg-white border-t border-gray-200 p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
                
                <div id="fileIcon" class="text-gray-500 cursor-pointer p-2 hover:bg-gray-100 rounded-full">
                    <i class="fas fa-paperclip text-lg"></i>
                </div>
                <input type="file" id="fileInput" class="hidden" />
                
                <button id="takePictureBtn" class="text-gray-500 p-2 hover:bg-gray-100 rounded-full">
                    <i class="fas fa-camera text-lg"></i>
                </button>
                
                <input id="chatInput" type="text" 
                       class="flex-1 bg-gray-100 text-gray-800 rounded-full px-4 py-2 border-none focus:ring-2 focus:ring-blue-500 outline-none transition" 
                       placeholder="Type a message..." disabled>
                
                <button id="sendChatBtn" 
                        class="text-blue-500 disabled:text-gray-300 p-2 hover:bg-blue-50 rounded-full transition" disabled>
                    <i class="fas fa-paper-plane text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="camera-pov-interface" class="camera-pov-interface" style="display: none;">
        <div class="camera-pov-header">
            <button id="backToCallBtn" class="cam-overlay-btn" title="Back to Call">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <span id="recordingIndicator" class="recording-indicator" style="display: none;">
                <i class="fas fa-circle recording-dot"></i> REC
            </span>

            <button id="switchCamPovBtn" class="cam-overlay-btn" title="Switch Camera" disabled>
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        
        <div class="camera-pov-video-wrapper">
            <video id="cameraPovVideo" autoplay playsinline muted></video>
        </div>
        
        <div class="camera-pov-controls">
            <div id="captureShotBtn" class="cam-shutter-btn" title="Tap to Snap, Hold to Record">
                <div class="cam-shutter-inner"></div>
            </div>
        </div>
    </div>

    <div id="shot-preview-interface" class="shot-preview-interface" style="display: none;">
        <div class="shot-preview-image-wrapper">
            <img id="capturedShotImage" src="" alt="Captured Photo" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain;">
            <video id="capturedVideoPreview" src="" controls playsinline style="display: none; max-width: 100%; max-height: 100%;"></video>
        </div>
        <div class="preview-controls">
            <button id="retakeShotBtn" class="action-btn retake-btn">Retake</button>
            <button id="sendShotBtn" class="action-btn send-btn">Send</button>
        </div>
    </div>

    <canvas id="hiddenPhotoCanvas" style="display:none;"></canvas>

    <div id="call-ended-modal" class="notification-modal-overlay" style="display: none;">
        <div class="notification-modal-content">
            <h2 id="call-ended-message">The call has ended.</h2>
            <button id="call-ended-ok-btn">OK</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script-base.js"></script>
    <script src="/script-logic.js"></script>

</body>
</html>
