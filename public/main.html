<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Teleconsultation</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/desktop.css" media="(min-width: 769px)">
    <style>
        /* --- MODIFICATION: Notification Modal Styles --- */
        .notification-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .notification-modal-content {
            background-color: #fff; padding: 24px 32px; border-radius: 12px;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 90%; width: 350px;
        }
        .notification-modal-content h2 { margin-top: 0; color: #333; font-size: 20px; }
        .notification-modal-content button {
            background-color: #5C6BC0; color: white; border: none;
            padding: 10px 24px; border-radius: 8px; cursor: pointer;
            font-size: 16px; font-weight: 600; margin-top: 16px;
            transition: background-color 0.2s;
        }
        .notification-modal-content button:hover { background-color: #3F51B5; }

        /* --- NEW: MOBILE RESPONSIVE FIXES --- */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent body scroll when call is active */
            font-family: sans-serif;
            background-color: #f0f2f5;
        }

        /* 1. Main Interface Layout - Uses Flexbox to fill screen */
        .call-interface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh; /* Dynamic Viewport Height for Mobile Browsers */
            background-color: #000;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        /* 2. Header - Overlay on top */
        .call-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            box-sizing: border-box;
        }

        /* 3. Body Layout - Takes remaining space */
        #call-body-layout {
            flex: 1;
            position: relative;
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 4. Main Content Area */
        .main-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 5. Video Handling */
        .video-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures video fills screen without whitespace */
        }

        /* Mini Video - Floating Picture-in-Picture */
        #miniVideoContainer {
            position: absolute;
            bottom: 90px; /* Above control bar */
            right: 15px;
            width: 100px;
            height: 150px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #miniVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 6. Controls Bar - Fixed at bottom */
        .control-tab {
            height: 80px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom); /* For iPhone X+ */
            z-index: 30;
            flex-shrink: 0;
        }

        .control-tab button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            background-color: #333;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .control-tab button.end-call-button {
            background-color: #ff4444;
        }

        /* 7. Chat Container - Full Screen Overlay on Mobile */
        .chat-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 50; /* Sit on top of video */
            display: flex;
            flex-direction: column;
            /* Standard toggle logic usually sets display: block/none via JS */
        }

        .chat-header {
            padding: 15px;
            background-color: #f0f2f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fff;
        }

        .chat-controls {
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
        }

        /* Hiding the title when call is active to save space */
        .call-interface[style*="display: block"] ~ .teleconsultation-title,
        .call-interface[style*="display: flex"] ~ .teleconsultation-title {
            display: none;
        }

        /* Camera POV & Preview Interfaces */
        .camera-pov-interface, .shot-preview-interface {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; background: #000; display: flex; flex-direction: column;
        }
        .camera-pov-video-wrapper, .shot-preview-image-wrapper {
            flex: 1; position: relative; width: 100%; overflow: hidden;
        }
        #cameraPovVideo, #capturedShotImage, #capturedVideoPreview {
            width: 100%; height: 100%; object-fit: contain;
        }
        .camera-pov-controls, .preview-controls {
            height: 100px; display: flex; justify-content: center; align-items: center; gap: 20px;
            background: rgba(0,0,0,0.8); padding-bottom: env(safe-area-inset-bottom);
        }
        .capture-btn, .action-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="background-sticker sticker-stethoscope"></div>
    <div class="background-sticker sticker-heartbeat"></div>
    <div class="background-sticker sticker-dna"></div>
    <div class="background-sticker sticker-pill"></div>
    <div class="background-sticker sticker-microscope"></div>
    <div class="background-sticker sticker-mmh"></div>

    <h1 class="teleconsultation-title">Teleconsultation</h1>

    <div id="loading-screen" class="loading-screen" style="display: none;">
        <p>Loading...</p>
    </div>

    <div id="call-interface" class="call-interface" style="display: none;">
        
        <div id="call-header" class="call-header">
            <div class="header-left-group"> 
                <span>Room ID: <strong id="activeRoomCode">--</strong></span>
            </div>
            <span><strong id="callTimer">00:00:00</strong></span>
        </div>

        <div id="call-body-layout">
            <div id="main-content" class="main-content">
                <div id="mainVideoContainer" class="video-wrapper">
                    <video id="mainVideo" autoplay playsinline></video>
                    <div id="mainVideoNameLabel" class="name-label"></div>

                    <div id="miniVideoContainer" class="video-wrapper mini-preview-hidden">
                        <video id="miniVideo" autoplay muted playsinline></video>
                        <div id="miniVideoNameLabel" class="name-label"></div>
                    </div>
                </div>

                <div id="control-tab" class="control-tab">
                    <button id="toggleMicBtn" title="Toggle Microphone"><i class="fas fa-microphone"></i></button>
                    <button id="toggleCamBtn" title="Toggle Camera"><i class="fas fa-video"></i></button>
                    <button id="toggleChatBtn" title="Toggle Chat"><i class="fa fa-comment"></i></button>
                    <button id="endCallBtn" title="End Call" class="end-call-button"><i class="fas fa-phone-slash"></i></button>
                </div>
            </div>

            <div id="chat-container" class="chat-container" style="display: none;"> <div id="chat-header" class="chat-header">
                    <span>
                        <span id="chatPeerNameDisplay">Waiting for user</span>
                        <span id="peerStatusDot" class="peer-status-dot status-offline"></span>
                        <span id="typingIndicator" class="typing-indicator" style="display: none;"></span>
                    </span>
                    <div>
                        <button id="saveChatHistoryBtn" class="icon-button" title="Save Chat History" style="background:none; border:none; font-size:18px; margin-right:10px;">
                            <i class="fas fa-save"></i>
                        </button>
                        <button id="exitChatBtn" class="exit-btn" title="Close Chat" style="background:none; border:none; font-size:18px;">&#x2716;</button>
                    </div>
                </div>

                <div id="chat-box" class="chat-box">
                    </div>

                <div id="chat-controls" class="chat-controls">
                    <label id="fileIcon" class="file-icon" title="Attach File" style="font-size: 20px; padding: 0 10px;">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" id="fileInput" class="file-input" style="display: none;" />
                    </label>
                    <button id="takePictureBtn" title="Take a Picture" style="background:none; border:none; font-size: 20px; padding: 0 10px;"><i class="fas fa-camera"></i></button>
                    <input id="chatInput" type="text" class="chat-input" placeholder="Type a message..." disabled>
                    <button id="sendChatBtn" title="Send Message" disabled style="background: #5C6BC0; color: white; border:none; padding: 8px 12px; border-radius: 5px;"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="camera-pov-interface" class="camera-pov-interface" style="display: none;">
        <div class="camera-pov-header" style="position: absolute; top:0; width:100%; z-index:10; padding: 15px; display:flex; justify-content:space-between; color:white;">
            <button id="backToCallBtn" class="control-btn" title="Back to Call" style="background:none; border:none; color:white; font-size:24px;">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <span id="recordingIndicator" class="recording-indicator">
                <i class="fas fa-circle recording-dot" style="color:red;"></i> REC
            </span>
            <button id="switchCamPovBtn" class="control-btn camera-switch-btn" title="Switch Camera" style="background:none; border:none; color:white; font-size:24px;">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        <div class="camera-pov-video-wrapper">
            <video id="cameraPovVideo" autoplay playsinline muted></video>
        </div>
        <div class="camera-pov-controls">
            <button id="captureShotBtn" class="capture-btn" title="Capture Photo or Record Video" style="background:white; color:black;">
                <i class="fas fa-camera"></i>
            </button>
        </div>
    </div>

    <div id="shot-preview-interface" class="shot-preview-interface" style="display: none;">
        <div class="shot-preview-image-wrapper">
            <img id="capturedShotImage" src="" alt="Captured Photo" style="display: none;">
            <video id="capturedVideoPreview" src="" controls playsinline style="display: none;"></video>
        </div>
        <div class="preview-controls">
            <button id="retakeShotBtn" class="action-btn retake-btn" title="Retake" style="background: #ff4444; color:white;">
                <i class="fas fa-camera-rotate"></i>
            </button>
            <button id="sendShotBtn" class="action-btn send-btn" title="Upload & Send" style="background: #5C6BC0; color:white;">
                <i class="fas fa-arrow-up-from-bracket"></i>
            </button>
        </div>
    </div>

    <canvas id="hiddenPhotoCanvas" style="display:none;"></canvas>

    <div id="call-ended-modal" class="notification-modal-overlay" style="display: none;">
        <div class="notification-modal-content">
            <h2 id="call-ended-message">The call has ended.</h2>
            <button id="call-ended-ok-btn">OK</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script-base.js"></script>
    <script src="/script-logic.js"></script>

</body>
</html>
